name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Check
        run: mise run ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            apps/*/test-results/
          if-no-files-found: ignore

  sync-check:
    name: Sync Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Sync check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mise run sync-check -- --changed-plans "origin/${{ github.base_ref }}...HEAD"
          else
            mise run sync-check
          fi

  verify:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: [check, sync-check]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Verify
        run: mise run verify
