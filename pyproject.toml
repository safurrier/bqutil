[project]
name = "bqutil"
version = "0.1.0"
description = "Execute BigQuery SQL files and analyze BigQuery jobs"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "google-cloud-bigquery>=3.0",
    "google-cloud-bigquery-storage>=2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "rich>=13.0",
    "db-dtypes>=1.0",
]

[project.scripts]
bqutil = "bqutil.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "ty>=0.0.19",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bqutil"]

# ── Ruff ─────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".agent/skills/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (formatter handles this)
    "S101",  # assert usage (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"bqutil/gcp.py" = ["S607"] # gcloud is intentionally resolved from the user's PATH.

[tool.ruff.lint.isort]
known-first-party = ["bqutil"]

# ── ty ───────────────────────────────────────
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".agent/skills/**"]

# ── Pytest ───────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist=loadfile --cov=bqutil --cov-report=term-missing --junit-xml=test-results/junit.xml -q"
